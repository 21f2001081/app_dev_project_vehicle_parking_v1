{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h2>Add New Parking Lot</h2>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Location</label>
      <input type="text" name="location" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      <textarea name="address" class="form-control" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Pincode</label>
      <input type="number" name="pincode" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Price per unit time</label>
      <input type="number" name="price" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Max Spots</label>
      <input type="number" name="max_no_spots" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Landmark</label>
      <input type="text" name="landmark" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-success">Create Lot</button>
    <a href="{{ url_for('manage_lots') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
