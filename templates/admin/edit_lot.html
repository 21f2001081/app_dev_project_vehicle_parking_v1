{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h2>Edit Parking Lot - {{ lot.location }}</h2>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Location</label>
      <input type="text" name="location" class="form-control" value="{{ lot.location }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      <textarea name="address" class="form-control" required>{{ lot.address }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Pincode</label>
      <input type="number" name="pincode" class="form-control" value="{{ lot.pincode }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Price per unit time</label>
      <input type="number" name="price" class="form-control" value="{{ lot.price }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Landmark</label>
      <input type="text" name="landmark" class="form-control" value="{{ lot.landmark }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Update</button>
    <a href="{{ url_for('manage_lots') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
