{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center">
    <h2>Parking Lots</h2>
    <a href="{{ url_for('add_lot') }}" class="btn btn-primary">Add New Lot</a>
  </div>
  <table class="table table-striped mt-3">
    <thead>
      <tr>
        <th>ID</th><th>Location</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for lot in lots %}
      <tr>
        <td>{{ lot.id }}</td>
        <td>{{ lot.location }}</td>
        <td>
          <a href="{{ url_for('edit_lot', lot_id=lot.id) }}" class="btn btn-sm btn-warning">Edit</a>
          <a href="{{ url_for('view_lot', lot_id=lot.id) }}" class="btn btn-sm btn-info">View</a>
          <a href="{{ url_for('delete_lot', lot_id=lot.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure? This will delete this lot.');">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
