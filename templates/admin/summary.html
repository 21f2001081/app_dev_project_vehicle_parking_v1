{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h2>Admin Summary</h2>

  <h4 class="mt-4">Revenue by Parking Lot</h4>
  <canvas id="revenueChart" height="100"></canvas>

  <h4 class="mt-5">Spot Occupancy per Parking Lot</h4>
  <canvas id="occupancyChart" height="120"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const revenueCtx = document.getElementById('revenueChart');
  const revenueChart = new Chart(revenueCtx, {
    type: 'bar',
    data: {
      labels: {{ revenue_data|map(attribute=0)|list|tojson }},
      datasets: [{
        label: 'Revenue (₹)',
        data: {{ revenue_data|map(attribute=1)|list|tojson }},
        backgroundColor: 'rgba(54, 162, 235, 0.7)',
        borderColor: 'rgba(54, 162, 235, 1)',
        borderWidth: 1
      }]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true } } }
  });

  const occupancyCtx = document.getElementById('occupancyChart');
  const occupancyChart = new Chart(occupancyCtx, {
    type: 'bar',
    data: {
      labels: {{ occupancy_data|map(attribute=0)|list|tojson }},
datasets: [
  {
    label: 'Occupied',
    data: {{ occupancy_data|map(attribute=1)|list|tojson }},
    backgroundColor: 'rgba(255, 99, 132, 0.7)'
  },
  {
    label: 'Unavailable',
    data: {{ occupancy_data|map(attribute=2)|list|tojson }},
    backgroundColor: 'rgba(255, 206, 86, 0.7)'  // Yellowish
  },
  {
    label: 'Available',
    data: {{ occupancy_data|map(attribute=3)|list|tojson }},
    backgroundColor: 'rgba(75, 192, 192, 0.7)'  // Greenish
  }
]
    },
    options: {
      responsive: true,
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true }
      }
    }
  });
</script>
{% endblock %}
