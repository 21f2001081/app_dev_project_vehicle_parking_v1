{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Registered Users</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>User ID</th>
        <th>Username</th>
        <th>Full Name</th>
        <th>Address</th>
        <th>Pincode</th>
        <!-- Add more fields if you collected them during registration -->
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.full_name }}</td>
        <td>{{ user.address }}</td>
        <td>{{ user.pincode }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
