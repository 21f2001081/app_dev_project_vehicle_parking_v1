{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h3>Edit Profile</h3>
  <form method="POST">
    <div class="mb-3">
      <label for="full_name" class="form-label">Full Name</label>
      <input type="text" name="full_name" id="full_name" class="form-control" value="{{ user.full_name }}" required>
    </div>
    <div class="mb-3">
      <label for="address" class="form-label">Address</label>
      <textarea name="address" id="address" class="form-control" rows="3" required>{{ user.address }}</textarea>
    </div>
    <div class="mb-3">
      <label for="pincode" class="form-label">Pincode</label>
      <input type="number" name="pincode" id="pincode" class="form-control" value="{{ user.pincode }}" required>
    </div>
    <button type="submit" class="btn btn-success">Update Profile</button>
    <a href="{{ url_for('user_profile') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
