{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h3>User Profile</h3>
  <table class="table">
    <tr><th>Username</th><td>{{ user.username }}</td></tr>
    <tr><th>Full Name</th><td>{{ user.full_name }}</td></tr>
    <tr><th>Address</th><td>{{ user.address }}</td></tr>
    <tr><th>Pincode</th><td>{{ user.pincode }}</td></tr>
  </table>
  <a href="{{ url_for('edit_user_profile') }}" class="btn btn-primary">Edit Profile</a>
  <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
</div>
{% endblock %}
